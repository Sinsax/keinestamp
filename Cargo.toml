[package]
name = "keinestamp"
version = "0.2.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ureq = "2"
tiny_http = "0.12"
zip = "2"
base64 = "0.22"
getrandom = "0.2"

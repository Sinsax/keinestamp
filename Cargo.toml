[package]
name = "keinestamp"
version = "0.5.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ureq = "2"
tiny_http = "0.12"
socket2 = "0.6"
zip = "2"
flate2 = "1"
base64 = "0.22"
getrandom = "0.2"
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
ureq = "2"
sha2 = "0.10"
hex = "0.4"
zip = "2"
tar = "0.4"
flate2 = "1"
